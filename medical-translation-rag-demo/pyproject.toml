[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrans-rag-demo"
version = "0.1.0"
description = "Portfolio demo of hybrid retrieval and terminology-aware multilingual translation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
elasticsearch = ["elasticsearch>=8.12"]
mlflow = ["mlflow>=2.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
